:root{
  --bg:#E8EEF5; --surface:#FFFFFF; --surface-2:#F3F6FA; --paper:#FFFFFF;
  --ink:#1C2736; --muted:#5A687C; --line:#CCD5E1;
  --accent:#2F62D8; --accent-ink:#FFFFFF; --accent-soft:#DDE7FB;
  --good:#1D8757; --good-soft:#D5EFE2; --bad:#C4443A; --bad-soft:#F7DDDA;
  --staff:#2A3443; --note:#121A26; --key-w:#FFFFFF; --key-b:#1E2733; --key-edge:#9AA7B8;
  --shadow:0 1px 2px rgba(28,39,54,.06),0 8px 24px rgba(28,39,54,.07);
  --font:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#10151D; --surface:#19212C; --surface-2:#222B38; --paper:#F5F7FA;
    --ink:#E6ECF3; --muted:#9DAABB; --line:#313C4B;
    --accent:#6D93F2; --accent-ink:#0D1320; --accent-soft:#233257;
    --good:#4CC28A; --good-soft:#173B2B; --bad:#F07C70; --bad-soft:#44221F;
    --key-edge:#58657A; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#10151D; --surface:#19212C; --surface-2:#222B38; --paper:#F5F7FA;
  --ink:#E6ECF3; --muted:#9DAABB; --line:#313C4B;
  --accent:#6D93F2; --accent-ink:#0D1320; --accent-soft:#233257;
  --good:#4CC28A; --good-soft:#173B2B; --bad:#F07C70; --bad-soft:#44221F;
  --key-edge:#58657A; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;padding-inline:16px;padding-block:16px 40px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:900;margin:0;letter-spacing:.02em;text-wrap:balance;flex:1 1 auto}
h1 small{display:block;font-size:.78rem;font-weight:500;color:var(--muted);letter-spacing:.04em}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:.85rem;color:var(--muted);white-space:nowrap}
.chip b{color:var(--ink);font-size:1.05rem;font-variant-numeric:tabular-nums;margin-left:4px}
button{font-family:inherit;font-size:1rem;cursor:pointer;color:inherit}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.iconbtn{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 14px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.iconbtn svg{width:18px;height:18px}

.board{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);overflow:hidden;position:relative}
.sheet{background:var(--paper);position:relative;border-bottom:1px solid var(--line)}
#staff{display:block;width:100%;height:auto;max-height:52vh}
.stamp{position:absolute;right:18px;top:12px;width:78px;height:78px;border-radius:50%;display:grid;place-items:center;font-size:52px;font-weight:900;line-height:1;border:5px solid currentColor;transform:rotate(-8deg);background:rgba(255,255,255,.85)}
.stamp.good{color:#1D8757}.stamp.bad{color:#C4443A}
@media (prefers-reduced-motion: no-preference){.stamp{animation:pop .28s cubic-bezier(.3,1.6,.5,1)}}
@keyframes pop{from{transform:rotate(-8deg) scale(.4);opacity:0}to{transform:rotate(-8deg) scale(1);opacity:1}}
.answer{padding:14px 18px 16px;display:flex;flex-direction:column;gap:10px}
.ansline{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;min-height:2.6rem}
.ansname{font-size:2rem;font-weight:900;letter-spacing:.04em}
.ansname.hide{color:var(--muted);font-size:1.1rem;font-weight:700;letter-spacing:.02em}
.anssub{color:var(--muted);font-size:.95rem}
.kbd-wrap{overflow-x:auto;border-radius:8px;-webkit-overflow-scrolling:touch}
#kbd{display:block}
.micline{display:flex;align-items:center;gap:10px;font-size:.95rem;color:var(--muted);flex-wrap:wrap}
.meter{width:90px;height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.meter i{display:block;height:100%;width:0;background:var(--accent);transition:width .08s linear}
.heard{font-weight:700;color:var(--ink)}
.msg{font-size:.92rem;padding:10px 12px;border-radius:10px;background:var(--bad-soft);color:var(--ink)}

.controls{display:grid;grid-template-columns:1.4fr 1fr;gap:10px}
.big{min-height:62px;border-radius:16px;font-size:1.2rem;font-weight:900;border:0;padding:8px 14px}
.primary{background:var(--accent);color:var(--accent-ink)}
.secondary{background:var(--surface);border:2px solid var(--line);color:var(--ink)}
.judge{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ok{background:var(--good-soft);color:var(--good);border:2px solid var(--good)}
.ng{background:var(--bad-soft);color:var(--bad);border:2px solid var(--bad)}
.modebar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:9px;padding:7px 14px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink)}
.hint{font-size:.85rem;color:var(--muted)}
.history{display:flex;gap:4px;flex-wrap:wrap;align-items:center;min-height:14px}
.history span{width:12px;height:12px;border-radius:50%}
.history .o{background:var(--good)}.history .x{background:var(--bad)}
.weak{font-size:.9rem;color:var(--muted)}
.weak b{color:var(--ink)}

/* settings */
.overlay{position:fixed;inset:0;background:rgba(10,15,25,.45);display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;padding:24px 12px;z-index:10}
.panel{background:var(--surface);color:var(--ink);border-radius:18px;max-width:640px;width:100%;box-shadow:var(--shadow);padding:18px 18px 20px;display:flex;flex-direction:column;gap:18px}
.panel h2{margin:0;font-size:1.25rem;font-weight:900;display:flex;justify-content:space-between;align-items:center;gap:8px}
fieldset{border:1px solid var(--line);border-radius:14px;padding:12px 14px 14px;margin:0;display:flex;flex-direction:column;gap:10px}
legend{font-weight:900;padding:0 6px;font-size:1rem}
.row{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.tog{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:6px 10px;cursor:pointer;user-select:none;font-weight:700}
.tog input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.tog .g{font-family:"OnpuMusic",serif;font-weight:400;font-size:1.25rem;line-height:1}
select{font-family:inherit;font-size:1rem;padding:6px 8px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);min-width:0;max-width:100%}
.rangerow{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:8px;align-items:center}
.rangerow label{font-weight:700;font-size:.92rem;color:var(--muted)}
.presets{display:flex;gap:6px;flex-wrap:wrap}
.presets button{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:5px 12px;font-size:.88rem;font-weight:700}
.durpic{height:26px;width:auto;vertical-align:middle}
@media (max-width:520px){
  .controls{grid-template-columns:1fr 1fr}
  .ansname{font-size:1.6rem}
  .rangerow{grid-template-columns:auto 1fr}
  .stamp{width:62px;height:62px;font-size:40px}
}
</style>

<div class="wrap">
  <header>
    <h1>おんぷよみドリル<small>がくふの音を見て、ピアノでひいてみよう</small></h1>
    <div class="stats" aria-live="polite">
      <span class="chip">せいかい<b id="stCorrect">0</b> / <b id="stTotal">0</b></span>
      <span class="chip">れんぞく<b id="stStreak">0</b></span>
    </div>
    <button class="iconbtn" id="openSettings" aria-haspopup="dialog">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
      せってい
    </button>
  </header>

  <div class="modebar">
    <div class="seg" role="group" aria-label="こたえあわせのしかた">
      <button id="modeSelf" aria-pressed="true">じぶんで○×</button>
      <button id="modeMic" aria-pressed="false">マイクではんてい</button>
    </div>
    <span class="hint" id="modeHint">スペースキー：つぎの音 ／ エンター：こたえ</span>
  </div>

  <section class="board" aria-label="がくふ">
    <div class="sheet">
      <svg id="staff" viewBox="0 0 360 256" role="img" aria-label="五線譜"></svg>
      <div id="stamp" class="stamp" hidden></div>
    </div>
    <div class="answer">
      <div class="ansline">
        <span id="ansName" class="ansname hide">「こたえ」でたしかめよう</span>
        <span id="ansSub" class="anssub"></span>
      </div>
      <div id="micLine" class="micline" hidden>
        <span class="meter"><i id="meterBar"></i></span>
        <span id="micStatus">きいています…</span>
        <span id="heard" class="heard"></span>
      </div>
      <div id="micMsg" class="msg" hidden></div>
      <div class="kbd-wrap" id="kbdWrap"><svg id="kbd" role="img" aria-label="けんばん"></svg></div>
    </div>
  </section>

  <div class="controls">
    <button class="big primary" id="btnNext">つぎの音</button>
    <button class="big secondary" id="btnReveal">こたえ</button>
  </div>
  <div class="judge" id="judgeRow" hidden>
    <button class="big ok" id="btnOk">○ ひけた</button>
    <button class="big ng" id="btnNg">× ちがった</button>
  </div>

  <div class="history" id="history" aria-label="さいきんのけっか"></div>
  <div class="weak" id="weak"></div>
  <div><button class="iconbtn" id="resetStats">きろくをリセット</button></div>
</div>

<div class="overlay" id="settings" hidden role="dialog" aria-modal="true" aria-labelledby="setTitle">
  <div class="panel">
    <h2 id="setTitle">せってい <button class="iconbtn" id="closeSettings">とじる</button></h2>

    <fieldset>
      <legend>記号（音部記号）</legend>
      <div class="row">
        <label class="tog"><input type="checkbox" id="cTreble"><span class="g">𝄞</span>ト音記号</label>
        <label class="tog"><input type="checkbox" id="cBass"><span class="g">𝄢</span>ヘ音記号</label>
        <label class="tog"><input type="checkbox" id="cGrand">大譜表で表示</label>
      </div>
      <div class="hint">大譜表：ト音とヘ音の五線をならべて表示し、どちらかに音が出ます（ピアノの楽譜と同じ形）。</div>
    </fieldset>

    <fieldset>
      <legend>出る音のはんい</legend>
      <div class="presets">
        <button data-preset="inside">五線の中だけ</button>
        <button data-preset="ledger2">加線2本まで</button>
        <button data-preset="middle">中央ドのまわり</button>
        <button data-preset="all">ぜんぶ</button>
      </div>
      <div class="rangerow">
        <label for="tLo">ト音 いちばん下</label><select id="tLo"></select>
        <label for="tHi">いちばん上</label><select id="tHi"></select>
      </div>
      <div class="rangerow">
        <label for="bLo">ヘ音 いちばん下</label><select id="bLo"></select>
        <label for="bHi">いちばん上</label><select id="bHi"></select>
      </div>
    </fieldset>

    <fieldset>
      <legend>音符のしゅるい</legend>
      <div class="row" id="durRow"></div>
    </fieldset>

    <fieldset>
      <legend>臨時記号</legend>
      <div class="row">
        <label class="tog"><input type="checkbox" id="aSharp"><span class="g">♯</span>シャープ</label>
        <label class="tog"><input type="checkbox" id="aFlat"><span class="g">♭</span>フラット</label>
        <label class="tog"><input type="checkbox" id="aNat"><span class="g">♮</span>ナチュラル</label>
      </div>
      <div class="row">
        <label for="aRate" class="hint">出るわりあい</label>
        <select id="aRate">
          <option value="0.25">すこし（4回に1回）</option>
          <option value="0.5">ふつう（2回に1回）</option>
          <option value="0.8">たくさん</option>
        </select>
      </div>
    </fieldset>

    <fieldset>
      <legend>こたえの表示</legend>
      <div class="row">
        <label for="nameStyle" class="hint">音名</label>
        <select id="nameStyle">
          <option value="doremi">ドレミ</option>
          <option value="both">ドレミ ＋ C D E（オクターブ番号つき）</option>
          <option value="cde">C D E（オクターブ番号つき）</option>
        </select>
      </div>
      <div class="row">
        <label class="tog"><input type="checkbox" id="oSound">こたえで音をならす</label>
        <label class="tog"><input type="checkbox" id="oKbd">けんばんを表示</label>
      </div>
    </fieldset>

    <fieldset>
      <legend>マイクはんてい</legend>
      <div class="row">
        <label class="tog"><input type="checkbox" id="mOct">オクターブ（高さ）まで合わせる</label>
        <label class="tog"><input type="checkbox" id="mAuto">正解したら自動でつぎへ</label>
      </div>
      <div class="hint">ピアノの近くでマイクを使います。とても低い音（ヘ音の加線より下）は、1オクターブずれて聞きとることがあります。そのときは「オクターブまで合わせる」をオフにしてください。</div>
    </fieldset>
  </div>
</div>

<script>
(function(){
"use strict";
const LET=['C','D','E','F','G','A','B'];
const DO=['ド','レ','ミ','ファ','ソ','ラ','シ'];
const SEMI=[0,2,4,5,7,9,11];
const PC_DO=['ド','ド♯','レ','レ♯','ミ','ファ','ファ♯','ソ','ソ♯','ラ','ラ♯','シ'];
const PC_EN=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
const SP=14, H=SP/2;
// diatonic step index = octave*7 + letter
const CLEF={treble:{ref:30,min:24,max:49,glyph:'\u{1D11E}'}, bass:{ref:18,min:9,max:35,glyph:'\u{1D122}'}};
const DURS=[
  {id:'w',  label:'全音符',     head:'whole', stem:false, flags:0, dot:false},
  {id:'h.', label:'付点2分音符', head:'open',  stem:true,  flags:0, dot:true},
  {id:'h',  label:'2分音符',    head:'open',  stem:true,  flags:0, dot:false},
  {id:'q.', label:'付点4分音符', head:'fill',  stem:true,  flags:0, dot:true},
  {id:'q',  label:'4分音符',    head:'fill',  stem:true,  flags:0, dot:false},
  {id:'8.', label:'付点8分音符', head:'fill',  stem:true,  flags:1, dot:true},
  {id:'8',  label:'8分音符',    head:'fill',  stem:true,  flags:1, dot:false},
  {id:'16', label:'16分音符',   head:'fill',  stem:true,  flags:2, dot:false}
];
const PRESETS={
  inside:{tLo:30,tHi:38,bLo:18,bHi:26},
  ledger2:{tLo:26,tHi:42,bLo:14,bHi:30},
  middle:{tLo:28,tHi:32,bLo:24,bHi:28},
  all:{tLo:24,tHi:49,bLo:9,bHi:35}
};
const DEFAULTS={treble:true,bass:true,grand:false,tLo:28,tHi:39,bLo:17,bHi:28,
  durs:['w','h','q','8'],sharp:false,flat:false,nat:false,rate:'0.5',
  nameStyle:'doremi',sound:true,kbd:true,oct:true,auto:true,mode:'self'};

const $=id=>document.getElementById(id);
const store={
  get(){try{return JSON.parse(localStorage.getItem('onpu-settings')||'null')}catch(e){return null}},
  set(v){try{localStorage.setItem('onpu-settings',JSON.stringify(v))}catch(e){}}
};
let S=Object.assign({},DEFAULTS,store.get()||{});
if(S.mode==='mic') S.mode='self'; // マイクは毎回ボタンから開始

let cur=null, revealed=false, answered=false;
let stats={total:0,correct:0,streak:0,hist:[],miss:{}};

function letterOf(step){return {l:((step%7)+7)%7,o:Math.floor(step/7)}}
function stepLabel(step){const {l,o}=letterOf(step);return `${DO[l]}（${LET[l]}${o}）`}
function accSym(a){return a===1?'♯':a===-1?'♭':''}
function noteNames(n){
  const {l,o}=letterOf(n.step);
  const jp=DO[l]+accSym(n.acc), en=LET[l]+accSym(n.acc)+o;
  if(S.nameStyle==='cde') return {main:en,sub:''};
  if(S.nameStyle==='both') return {main:jp,sub:en};
  return {main:jp,sub:''};
}
function midiName(m){const pc=((m%12)+12)%12,o=Math.floor(m/12)-1;
  if(S.nameStyle==='cde') return PC_EN[pc]+o;
  if(S.nameStyle==='both') return `${PC_DO[pc]}（${PC_EN[pc]}${o}）`;
  return PC_DO[pc];}

/* ---------- note generation ---------- */
function rnd(n){return Math.floor(Math.random()*n)}
function pick(a){return a[rnd(a.length)]}
function randomNote(){
  const clefs=[]; if(S.treble) clefs.push('treble'); if(S.bass) clefs.push('bass');
  if(!clefs.length) clefs.push('treble');
  const durs=DURS.filter(d=>S.durs.includes(d.id)); if(!durs.length) durs.push(DURS[4]);
  const accPool=[]; if(S.sharp) accPool.push(1); if(S.flat) accPool.push(-1); if(S.nat) accPool.push('n');
  let n;
  for(let i=0;i<30;i++){
    const clef=pick(clefs);
    const lo=clef==='treble'?Math.min(S.tLo,S.tHi):Math.min(S.bLo,S.bHi);
    const hi=clef==='treble'?Math.max(S.tLo,S.tHi):Math.max(S.bLo,S.bHi);
    const step=lo+rnd(hi-lo+1);
    let acc=0,natural=false;
    if(accPool.length && Math.random()<parseFloat(S.rate)){const a=pick(accPool); if(a==='n'){natural=true}else acc=a;}
    const {l,o}=letterOf(step);
    const midi=(o+1)*12+SEMI[l]+acc;
    n={clef,step,acc,natural,dur:pick(durs),midi};
    if(!cur||cur.step!==n.step||cur.clef!==n.clef||cur.acc!==n.acc) break;
  }
  return n;
}

/* ---------- staff rendering ---------- */
const NS='http://www.w3.org/2000/svg';
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs){const v=attrs[k];if((k==='fill'||k==='stroke')&&typeof v==='string'&&v.startsWith('var('))e.style.setProperty(k,v);else e.setAttribute(k,v)}if(parent)parent.appendChild(e);return e}
const W=360, PAD=98;
function layout(){
  if(S.grand){const tb=PAD+4*SP, bb=tb+5*SP+4*SP;return {h:bb+PAD,bottom:{treble:tb,bass:bb},staves:['treble','bass']}}
  const clef=cur?cur.clef:(S.treble?'treble':'bass');
  const b=PAD+4*SP; return {h:b+PAD,bottom:{[clef]:b},staves:[clef]};
}
function render(state){
  const svg=$('staff'); svg.innerHTML='';
  const L=layout(); svg.setAttribute('viewBox',`0 0 ${W} ${L.h}`);
  const ink='var(--staff)';
  const x0=14,x1=W-14;
  L.staves.forEach(c=>{
    const b=L.bottom[c];
    for(let i=0;i<5;i++) el('line',{x1:x0,x2:x1,y1:b-i*SP,y2:b-i*SP,stroke:ink,'stroke-width':1.3},svg);
    el('line',{x1:x1,x2:x1,y1:b-4*SP,y2:b,stroke:ink,'stroke-width':1.3},svg);
    const t=el('text',{x:x0+8,y:b-(c==='treble'?SP:3*SP),'font-family':'OnpuMusic','font-size':4*SP,fill:ink},svg);
    t.textContent=CLEF[c].glyph;
  });
  if(S.grand){
    const top=L.bottom.treble-4*SP, bot=L.bottom.bass;
    el('line',{x1:x0,x2:x0,y1:top,y2:bot,stroke:ink,'stroke-width':1.6},svg);
    el('line',{x1:x1,x2:x1,y1:top,y2:bot,stroke:ink,'stroke-width':1.3},svg);
    const bx=x0-6, my=(top+bot)/2;
    el('path',{d:`M${x0-1} ${top} C ${bx-8} ${top+12}, ${bx+4} ${my-14}, ${bx-6} ${my} C ${bx+4} ${my+14}, ${bx-8} ${bot-12}, ${x0-1} ${bot} C ${bx-3} ${bot-14}, ${bx+8} ${my+16}, ${bx-3} ${my} C ${bx+8} ${my-16}, ${bx-3} ${top+14}, ${x0-1} ${top} Z`,fill:ink},svg);
  }
  if(!cur) return;
  const color=state==='good'?'#1D8757':state==='bad'?'#C4443A':'var(--note)';
  const ref=CLEF[cur.clef].ref, b=L.bottom[cur.clef];
  const y=s=>b-(s-ref)*H;
  const cx=W*0.6, cy=y(cur.step), d=cur.dur, whole=d.head==='whole';
  const lw=whole?SP*1.15:SP*1.0;
  for(let s=ref-2;s>=cur.step;s-=2) el('line',{x1:cx-lw,x2:cx+lw,y1:y(s),y2:y(s),stroke:ink,'stroke-width':1.5},svg);
  for(let s=ref+10;s<=cur.step;s+=2) el('line',{x1:cx-lw,x2:cx+lw,y1:y(s),y2:y(s),stroke:ink,'stroke-width':1.5},svg);
  const g=el('g',{fill:color},svg);
  // head
  if(whole){
    el('ellipse',{cx,cy,rx:SP*0.8,ry:SP*0.5},g);
    el('ellipse',{cx,cy,rx:SP*0.34,ry:SP*0.27,transform:`rotate(-55 ${cx} ${cy})`,fill:'var(--paper)'},g);
  }else{
    el('ellipse',{cx,cy,rx:SP*0.66,ry:SP*0.45,transform:`rotate(-22 ${cx} ${cy})`},g);
    if(d.head==='open') el('ellipse',{cx,cy,rx:SP*0.52,ry:SP*0.2,transform:`rotate(-32 ${cx} ${cy})`,fill:'var(--paper)'},g);
  }
  // stem + flags
  if(d.stem){
    const mid=b-2*SP, up=cur.step<ref+4;
    const hw=SP*0.62, len=SP*(3.5+(d.flags>1?0.6:0));
    const sx=up?cx+hw-0.7:cx-hw+0.7;
    let ty=up?cy-len:cy+len;
    if(up&&ty>mid) ty=mid; if(!up&&ty<mid) ty=mid;
    el('line',{x1:sx,x2:sx,y1:up?cy-2:cy+2,y2:ty,stroke:color,'stroke-width':1.6},svg);
    for(let i=0;i<d.flags;i++){
      const k=up?1:-1, t=ty+k*i*SP*0.9;
      el('path',{d:`M${sx} ${t} C ${sx+SP*0.15} ${t+k*SP*1.0}, ${sx+SP*1.4} ${t+k*SP*1.25}, ${sx+SP*0.95} ${t+k*SP*2.9} C ${sx+SP*1.1} ${t+k*SP*1.8}, ${sx+SP*0.45} ${t+k*SP*1.55}, ${sx} ${t+k*SP*1.25} Z`},g);
    }
  }
  if(d.dot){
    const onLine=((cur.step-ref)%2+2)%2===0;
    el('circle',{cx:cx+(whole?SP*1.35:SP*1.15),cy:onLine?cy-H:cy,r:2.4},g);
  }
  if(cur.acc||cur.natural){
    const ch=cur.acc===1?'♯':cur.acc===-1?'♭':'♮';
    const off=ch==='♭'?0.1:0.13;
    const t=el('text',{x:cx-(whole?SP*1.2:SP*0.95),y:cy+off*4*SP,'font-family':'OnpuMusic','font-size':4*SP,'text-anchor':'end'},g);
    t.textContent=ch;
  }
}

/* ---------- keyboard ---------- */
const KW=16,KH=66,BW=10,BH=40;
const whiteMidis=[];for(let m=21;m<=108;m++){if([0,2,4,5,7,9,11].includes(m%12))whiteMidis.push(m)}
const keyX={};
function buildKbd(){
  const svg=$('kbd'); svg.innerHTML='';
  const w=whiteMidis.length*KW; svg.setAttribute('viewBox',`0 0 ${w} ${KH+2}`); svg.setAttribute('width',w); svg.setAttribute('height',KH+2);
  whiteMidis.forEach((m,i)=>{
    keyX[m]=i*KW+KW/2;
    el('rect',{x:i*KW+0.5,y:0.5,width:KW-1,height:KH,rx:2.5,fill:'var(--key-w)',stroke:'var(--key-edge)','stroke-width':1,id:'k'+m},svg);
    if(m%12===0){const t=el('text',{x:i*KW+KW/2,y:KH-6,'text-anchor':'middle','font-size':7.5,fill:m===60?'#2F62D8':'#6B778A','font-weight':m===60?700:500,'font-family':'system-ui,sans-serif'},svg);t.textContent='C'+(m/12-1)}
  });
  for(let m=21;m<=108;m++){
    if([1,3,6,8,10].includes(m%12)){
      const x=keyX[m-1]+KW/2-BW/2; keyX[m]=x+BW/2;
      el('rect',{x,y:0.5,width:BW,height:BH,rx:1.5,fill:'var(--key-b)',id:'k'+m},svg);
    }
  }
}
let lit=null;
function lightKey(m){
  if(lit){const k=$('k'+lit.m); if(k) k.style.fill=lit.f}
  lit=null; if(m==null) return;
  const k=$('k'+m); if(!k) return;
  lit={m,f:k.style.fill}; k.style.fill='#2F62D8';
  const wrap=$('kbdWrap'); const scale=$('kbd').getBoundingClientRect().width/($('kbd').viewBox.baseVal.width||1);
  wrap.scrollTo({left:keyX[m]*scale-wrap.clientWidth/2,behavior:'smooth'});
}
function centerKbd(m){const wrap=$('kbdWrap');wrap.scrollLeft=keyX[m]-wrap.clientWidth/2}

/* ---------- sound ---------- */
let actx=null, muteUntil=0;
function ac(){if(!actx){const C=window.AudioContext||window.webkitAudioContext; actx=new C()} if(actx.state==='suspended') actx.resume(); return actx}
function play(m){
  try{
    const c=ac(), t=c.currentTime, f=440*Math.pow(2,(m-69)/12);
    const out=c.createGain(); out.gain.setValueAtTime(0.0001,t); out.gain.exponentialRampToValueAtTime(0.32,t+0.008); out.gain.exponentialRampToValueAtTime(0.0001,t+1.9);
    const lp=c.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=Math.min(6000,f*8);
    [[1,1],[2,0.45],[3,0.2],[4,0.1],[5,0.05]].forEach(([k,a])=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=f*k;g.gain.value=a;o.connect(g);g.connect(lp);o.start(t);o.stop(t+2)});
    lp.connect(out); out.connect(c.destination);
    muteUntil=performance.now()+2100;
  }catch(e){}
}

/* ---------- mic / pitch ---------- */
let mic=null, listening=false, stable=0, lastM=null, wrongOnce=false;
function yin(x,sr){
  const N=x.length, maxLag=Math.min(Math.floor(sr/38),N>>1), minLag=Math.max(2,Math.floor(sr/2400)), Wn=N-maxLag;
  const d=new Float32Array(maxLag+2);
  for(let t=1;t<=maxLag+1&&t<N-Wn;t++){let s=0;for(let j=0;j<Wn;j++){const v=x[j]-x[j+t];s+=v*v}d[t]=s}
  let run=0; d[0]=1;
  for(let t=1;t<=maxLag+1;t++){run+=d[t]; d[t]=run?d[t]*t/run:1}
  for(let t=minLag;t<=maxLag;t++){
    if(d[t]<0.13){while(t+1<=maxLag&&d[t+1]<d[t])t++;
      const a=d[t-1],b=d[t],c=d[t+1],den=a+c-2*b,sh=den?(a-c)/(2*den):0;
      return sr/(t+sh)}
  }
  return 0;
}
async function startMic(){
  const msg=$('micMsg');
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia) throw new Error('nomic');
    const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    const c=ac(); const src=c.createMediaStreamSource(stream); const an=c.createAnalyser(); an.fftSize=4096; src.connect(an);
    mic={stream,an,buf:new Float32Array(an.fftSize),sr:c.sampleRate,timer:setInterval(tick,70)};
    msg.hidden=true; return true;
  }catch(e){
    msg.textContent='マイクが使えませんでした。ブラウザでマイクを「許可」してください。このページを開いている画面によってはマイクが使えないことがあります。その場合は「じぶんで○×」で練習できます。';
    msg.hidden=false; return false;
  }
}
function stopMic(){if(!mic)return;clearInterval(mic.timer);mic.stream.getTracks().forEach(t=>t.stop());mic=null;listening=false}
function tick(){
  if(!mic) return;
  mic.an.getFloatTimeDomainData(mic.buf);
  let r=0; for(let i=0;i<mic.buf.length;i++) r+=mic.buf[i]*mic.buf[i]; r=Math.sqrt(r/mic.buf.length);
  $('meterBar').style.width=Math.min(100,r*600)+'%';
  if(!listening||!cur||performance.now()<muteUntil){stable=0;return}
  if(r<0.008){stable=0;return}
  const f=yin(mic.buf,mic.sr); if(!f){stable=0;return}
  const mf=69+12*Math.log2(f/440), m=Math.round(mf);
  if(Math.abs(mf-m)>0.4){stable=0;return}
  if(m===lastM) stable++; else {lastM=m;stable=1}
  if(stable===2) $('heard').textContent='いまの音：'+midiName(m);
  if(stable>=4){stable=0; micJudge(m)}
}
function micJudge(m){
  const ok=S.oct?m===cur.midi:(((m-cur.midi)%12)+12)%12===0;
  if(ok){
    listening=false;
    if(!answered){record(true)}
    showResult(true); reveal(false);
    $('micStatus').textContent='せいかい！';
    if(S.auto) setTimeout(()=>{if(S.mode==='mic'&&revealed)next()},1300);
  }else{
    if(!answered){record(false); wrongOnce=true}
    showResult(false);
    $('micStatus').textContent='ちがうみたい。もういちど！';
    lastM=null; muteUntil=performance.now()+700;
  }
}

/* ---------- flow ---------- */
function showResult(ok){
  const s=$('stamp'); s.hidden=false; s.className='stamp '+(ok?'good':'bad'); s.textContent=ok?'○':'×';
  s.style.animation='none'; void s.offsetWidth; s.style.animation='';
  render(ok?'good':'bad');
}
function next(){
  cur=randomNote(); revealed=false; answered=false; wrongOnce=false; stable=0; lastM=null;
  $('stamp').hidden=true; render();
  $('ansName').className='ansname hide'; $('ansName').textContent= S.mode==='mic'?'ピアノでひいてみよう':'「こたえ」でたしかめよう';
  $('ansSub').textContent=''; $('heard').textContent='';
  $('judgeRow').hidden=true; lightKey(null);
  if(S.mode==='mic'&&mic){listening=true; $('micStatus').textContent='きいています…'}
}
function reveal(withSound){
  if(!cur) return;
  revealed=true;
  const nm=noteNames(cur);
  $('ansName').className='ansname'; $('ansName').textContent=nm.main;
  const clefName=cur.clef==='treble'?'ト音記号':'ヘ音記号';
  $('ansSub').textContent=[nm.sub, clefName, cur.dur.label].filter(Boolean).join('・');
  if(S.kbd) lightKey(cur.midi);
  if(withSound&&S.sound) play(cur.midi);
  if(S.mode==='self'&&!answered) $('judgeRow').hidden=false;
  if(S.mode==='mic'&&!answered){ /* 見ただけ = まちがい扱い */ record(false); }
}
function record(ok){
  if(answered) return; answered=true;
  stats.total++; if(ok){stats.correct++;stats.streak++}else{stats.streak=0; const k=noteNames(cur).main+'｜'+(cur.clef==='treble'?'ト音':'ヘ音'); stats.miss[k]=(stats.miss[k]||0)+1}
  stats.hist.push(ok); if(stats.hist.length>30) stats.hist.shift();
  drawStats();
}
function drawStats(){
  $('stCorrect').textContent=stats.correct; $('stTotal').textContent=stats.total; $('stStreak').textContent=stats.streak;
  $('history').innerHTML=stats.hist.map(o=>`<span class="${o?'o':'x'}"></span>`).join('');
  const w=Object.entries(stats.miss).sort((a,b)=>b[1]-a[1]).slice(0,3);
  $('weak').innerHTML=w.length?'にがてな音：'+w.map(([k,v])=>`<b>${k.replace('｜','（')}）</b> ${v}回`).join('　'):'';
}
function selfJudge(ok){ if(!cur||answered) return; record(ok); showResult(ok); $('judgeRow').hidden=true; setTimeout(next, ok?650:1100); }

/* ---------- settings UI ---------- */
function fillSelect(id,min,max){const s=$(id);s.innerHTML='';for(let d=max;d>=min;d--){const o=document.createElement('option');o.value=d;o.textContent=stepLabel(d)+(d===28?' 中央ド':'');s.appendChild(o)}}
fillSelect('tLo',24,49);fillSelect('tHi',24,49);fillSelect('bLo',9,35);fillSelect('bHi',9,35);
function durIcon(d){
  const s=`<svg class="durpic" viewBox="0 0 26 40" aria-hidden="true"><g fill="currentColor">`;
  let h='';
  if(d.head==='whole') h+=`<ellipse cx="10" cy="30" rx="7" ry="4.4"/><ellipse cx="10" cy="30" rx="3" ry="2.3" transform="rotate(-55 10 30)" fill="var(--surface-2)"/>`;
  else{h+=`<ellipse cx="9" cy="31" rx="6" ry="4" transform="rotate(-22 9 31)"/>`; if(d.head==='open') h+=`<ellipse cx="9" cy="31" rx="4.6" ry="1.8" transform="rotate(-32 9 31)" fill="var(--surface-2)"/>`;}
  if(d.stem) h+=`<rect x="13.3" y="4" width="1.6" height="26"/>`;
  for(let i=0;i<d.flags;i++){const t=4+i*7;h+=`<path d="M14.5 ${t} C 15 ${t+7}, 23 ${t+9}, 20 ${t+20} C 21 ${t+12}, 17 ${t+10}, 14.5 ${t+9} Z"/>`}
  if(d.dot) h+=`<circle cx="${d.head==='whole'?21:19}" cy="28" r="1.9"/>`;
  return s+h+'</g></svg>';
}
$('durRow').innerHTML=DURS.map(d=>`<label class="tog"><input type="checkbox" id="d_${d.id.replace('.','dot')}" data-dur="${d.id}">${durIcon(d)}${d.label}</label>`).join('');

function syncForm(){
  $('cTreble').checked=S.treble;$('cBass').checked=S.bass;$('cGrand').checked=S.grand;
  $('tLo').value=S.tLo;$('tHi').value=S.tHi;$('bLo').value=S.bLo;$('bHi').value=S.bHi;
  document.querySelectorAll('[data-dur]').forEach(c=>c.checked=S.durs.includes(c.dataset.dur));
  $('aSharp').checked=S.sharp;$('aFlat').checked=S.flat;$('aNat').checked=S.nat;$('aRate').value=S.rate;
  $('nameStyle').value=S.nameStyle;$('oSound').checked=S.sound;$('oKbd').checked=S.kbd;
  $('mOct').checked=S.oct;$('mAuto').checked=S.auto;
}
function readForm(){
  S.treble=$('cTreble').checked;S.bass=$('cBass').checked;
  if(!S.treble&&!S.bass){S.treble=true;$('cTreble').checked=true}
  S.grand=$('cGrand').checked;
  S.tLo=+$('tLo').value;S.tHi=+$('tHi').value;S.bLo=+$('bLo').value;S.bHi=+$('bHi').value;
  S.durs=[...document.querySelectorAll('[data-dur]')].filter(c=>c.checked).map(c=>c.dataset.dur);
  if(!S.durs.length){S.durs=['q'];syncForm()}
  S.sharp=$('aSharp').checked;S.flat=$('aFlat').checked;S.nat=$('aNat').checked;S.rate=$('aRate').value;
  S.nameStyle=$('nameStyle').value;S.sound=$('oSound').checked;S.kbd=$('oKbd').checked;
  S.oct=$('mOct').checked;S.auto=$('mAuto').checked;
  $('kbdWrap').hidden=!S.kbd;
  store.set(S);
}
document.querySelector('.panel').addEventListener('change',readForm);
document.querySelectorAll('[data-preset]').forEach(b=>b.addEventListener('click',()=>{Object.assign(S,PRESETS[b.dataset.preset]);syncForm();readForm()}));
$('openSettings').onclick=()=>{syncForm();$('settings').hidden=false;$('closeSettings').focus()};
function closeSettings(){$('settings').hidden=true;readForm();next();$('openSettings').focus()}
$('closeSettings').onclick=closeSettings;
$('settings').addEventListener('click',e=>{if(e.target.id==='settings')closeSettings()});

/* ---------- mode ---------- */
async function setMode(m){
  if(m==='mic'){
    $('micLine').hidden=false; $('micStatus').textContent='マイクを準備中…';
    const ok=mic?true:await startMic();
    if(!ok){$('micLine').hidden=true; m='self'}
  }else{stopMic(); $('micLine').hidden=true; $('micMsg').hidden=true}
  S.mode=m;
  $('modeSelf').setAttribute('aria-pressed',m==='self'); $('modeMic').setAttribute('aria-pressed',m==='mic');
  $('modeHint').textContent=m==='mic'?'ピアノでひくと、自動でたしかめます':'スペースキー：つぎの音 ／ エンター：こたえ';
  next();
}
$('modeSelf').onclick=()=>setMode('self');
$('modeMic').onclick=()=>setMode('mic');

$('btnNext').onclick=()=>{ac(); next()};
$('btnReveal').onclick=()=>{if(!revealed)reveal(true); else if(S.sound) play(cur.midi)};
$('btnOk').onclick=()=>selfJudge(true);
$('btnNg').onclick=()=>selfJudge(false);
$('resetStats').onclick=()=>{stats={total:0,correct:0,streak:0,hist:[],miss:{}};drawStats()};
document.addEventListener('keydown',e=>{
  if(!$('settings').hidden){if(e.key==='Escape')closeSettings();return}
  if(e.target.closest&&e.target.closest('select,input'))return;
  if(e.key===' '){e.preventDefault();next()}
  else if(e.key==='Enter'){e.preventDefault(); if(!revealed)reveal(true)}
  else if(revealed&&S.mode==='self'&&!answered&&(e.key==='o'||e.key==='1'))selfJudge(true)
  else if(revealed&&S.mode==='self'&&!answered&&(e.key==='x'||e.key==='2'))selfJudge(false)
});

/* ---------- start ---------- */
buildKbd(); syncForm(); $('kbdWrap').hidden=!S.kbd;
next();
requestAnimationFrame(()=>centerKbd(60));
if(document.fonts&&document.fonts.load){document.fonts.load('56px OnpuMusic','\u{1D11E}').then(()=>render()).catch(()=>{})}
})();
</script>
</body></html>
